name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      SHUCK_VERSION: "0.0.30"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install shuck as shellcheck
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/shuck-shellcheck"
          mkdir -p "$install_dir"
          gh release download "v${SHUCK_VERSION}" \
            --repo ewhauser/shuck \
            --pattern shuck-cli-x86_64-unknown-linux-gnu.tar.xz \
            --pattern shuck-cli-x86_64-unknown-linux-gnu.tar.xz.sha256 \
            --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          awk 'NF' shuck-cli-x86_64-unknown-linux-gnu.tar.xz.sha256 | sha256sum --check
          tar -xJf shuck-cli-x86_64-unknown-linux-gnu.tar.xz
          cp shuck-cli-x86_64-unknown-linux-gnu/shuck "$install_dir/shellcheck"
          chmod +x "$install_dir/shellcheck"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install actionlint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          gh release download "v${ACTIONLINT_VERSION}" \
            --repo rhysd/actionlint \
            --pattern "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --pattern "actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | awk 'NF' | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run ruff
        run: uvx ruff==0.15.12 check .

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run zizmor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.24.1 --no-online-audits --format github .github/workflows

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python
        run: uv python install 3.12

      - name: Run unit tests
        run: uv run --python 3.12 python -m unittest discover -s tests

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python
        run: uv python install 3.12

      - name: Validate checked-in index
        run: uv run --python 3.12 python scripts/validate_index.py registry

      - name: Rebuild and verify checked-in index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -R registry registry.expected
          uv run --python 3.12 python scripts/build_index.py --output-dir registry.generated
          diff -ru registry.expected registry.generated

  merge-generated-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bot/refresh-index'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.SHUCK_SHELLS_APP_ID }}
          private-key: ${{ secrets.SHUCK_SHELLS_APP_PRIVATE_KEY }}

      - name: Verify GitHub App installation
        env:
          ACTUAL_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          EXPECTED_INSTALLATION_ID: ${{ secrets.SHUCK_SHELLS_APP_INSTALLATION_ID }}
        run: test "$ACTUAL_INSTALLATION_ID" = "$EXPECTED_INSTALLATION_ID"

      - name: Enable auto-merge for generated PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
