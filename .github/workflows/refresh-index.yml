name: Refresh Index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.SHUCK_SHELLS_APP_ID }}
          private-key: ${{ secrets.SHUCK_SHELLS_APP_PRIVATE_KEY }}

      - name: Verify GitHub App installation
        env:
          ACTUAL_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          EXPECTED_INSTALLATION_ID: ${{ secrets.SHUCK_SHELLS_APP_INSTALLATION_ID }}
        run: test "$ACTUAL_INSTALLATION_ID" = "$EXPECTED_INSTALLATION_ID"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Rebuild index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_index.py --output-dir registry
          python3 scripts/validate_index.py registry

      - name: Create or update refresh PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          commit-message: "chore(index): refresh shell archive index"
          branch: bot/refresh-index
          delete-branch: false
          title: "chore(index): refresh shell archive index"
          body: |
            Automated nightly refresh of the published shell registry from GitHub release assets.
          labels: |
            automation
            index
