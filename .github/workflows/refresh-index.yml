name: Refresh Index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_index.py --output index.json
          python3 scripts/validate_index.py index.json

      - name: Create or update refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SHUCK_SHELLS_PR_TOKEN }}
          commit-message: "chore(index): refresh shell archive index"
          branch: bot/refresh-index
          delete-branch: false
          title: "chore(index): refresh shell archive index"
          body: |
            Automated nightly refresh of `index.json` from GitHub release assets.
          labels: |
            automation
            index
