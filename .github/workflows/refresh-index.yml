name: Refresh Index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SHUCK_SHELLS_APP_ID }}
          private-key: ${{ secrets.SHUCK_SHELLS_APP_PRIVATE_KEY }}

      - name: Verify GitHub App installation
        run: test "${{ steps.app-token.outputs.installation-id }}" = "${{ secrets.SHUCK_SHELLS_APP_INSTALLATION_ID }}"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_index.py --output-dir registry
          python3 scripts/validate_index.py registry

      - name: Create or update refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          commit-message: "chore(index): refresh shell archive index"
          branch: bot/refresh-index
          delete-branch: false
          title: "chore(index): refresh shell archive index"
          body: |
            Automated nightly refresh of the published shell registry from GitHub release assets.
          labels: |
            automation
            index
