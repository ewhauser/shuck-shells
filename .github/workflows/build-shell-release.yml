name: Build Shell Release

on:
  workflow_dispatch:
    inputs:
      shell:
        description: Shell name to build
        required: true
        type: string
      version:
        description: Upstream release version to build
        required: true
        type: string

run-name: Build ${{ inputs.shell }} ${{ inputs.version }}

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.shell }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-linux-gnu:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build archive
        run: |
          chmod +x scripts/build_shell_release.sh
          scripts/build_shell_release.sh "${{ inputs.shell }}" "${{ inputs.version }}" "${{ matrix.platform }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}
          path: dist/${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  build-linux-musl:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-musl
          - runner: ubuntu-22.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build archive in Alpine
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            alpine:3.22 \
            sh -lc '
              apk add --no-cache bash build-base curl ed ncurses-dev python3 tar xz
              chmod +x scripts/build_shell_release.sh
              scripts/build_shell_release.sh "${{ inputs.shell }}" "${{ inputs.version }}" "${{ matrix.platform }}" dist
            '

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}
          path: dist/${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  build-darwin:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: x86_64-darwin
          - runner: macos-15
            platform: aarch64-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build archive
        run: |
          chmod +x scripts/build_shell_release.sh
          scripts/build_shell_release.sh "${{ inputs.shell }}" "${{ inputs.version }}" "${{ matrix.platform }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}
          path: dist/${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - build-linux-gnu
      - build-linux-musl
      - build-darwin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SHUCK_SHELLS_APP_ID }}
          private-key: ${{ secrets.SHUCK_SHELLS_APP_PRIVATE_KEY }}

      - name: Verify GitHub App installation
        run: test "${{ steps.app-token.outputs.installation-id }}" = "${{ secrets.SHUCK_SHELLS_APP_INSTALLATION_ID }}"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ inputs.shell }}-${{ inputs.version }}-*
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.shell }}-${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.shell }} ${{ inputs.version }}
        run: |
          ls -l dist
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber --repo "$REPO"
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz \
              --repo "$REPO" \
              --title "$RELEASE_TITLE" \
              --notes "Automated ${{ inputs.shell }} ${{ inputs.version }} builds for shuck-shells."
          fi
