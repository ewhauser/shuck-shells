name: Build Shell Release

on:
  workflow_dispatch:
    inputs:
      shell:
        description: Shell name to build
        required: true
        type: string
      version:
        description: Upstream release version to build
        required: true
        type: string

run-name: Build ${{ inputs.shell }} ${{ inputs.version }}

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.shell }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip_build: ${{ steps.check-release.outputs.skip_build }}
      release_exists: ${{ steps.check-release.outputs.release_exists }}
      missing_assets: ${{ steps.check-release.outputs.missing_assets }}
    steps:
      - name: Check existing release assets
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.shell }}-${{ inputs.version }}
          SHELL_NAME: ${{ inputs.shell }}
          SHELL_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          expected_platforms = [
              "x86_64-linux-gnu",
              "aarch64-linux-gnu",
              "x86_64-linux-musl",
              "aarch64-linux-musl",
              "x86_64-darwin",
              "aarch64-darwin",
          ]
          shell_name = os.environ["SHELL_NAME"]
          shell_version = os.environ["SHELL_VERSION"]
          release_tag = os.environ["RELEASE_TAG"]
          expected_assets = [
              f"{shell_name}-{shell_version}-{platform}.tar.gz"
              for platform in expected_platforms
          ]

          release = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{os.environ['REPO']}/releases/tags/{release_tag}",
              ],
              check=False,
              capture_output=True,
              text=True,
          )

          release_exists = release.returncode == 0
          skip_build = False
          missing_assets = expected_assets

          if release_exists:
              payload = json.loads(release.stdout)
              existing_assets = {
                  asset["name"]
                  for asset in payload.get("assets", [])
              }
              missing_assets = [
                  asset for asset in expected_assets if asset not in existing_assets
              ]
              skip_build = not missing_assets

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as handle:
              handle.write(
                  f"release_exists={'true' if release_exists else 'false'}\n"
              )
              handle.write(
                  f"skip_build={'true' if skip_build else 'false'}\n"
              )
              handle.write(
                  f"missing_assets={json.dumps(missing_assets, separators=(',', ':'))}\n"
              )

          if skip_build:
              print(
                  f"Release {release_tag} already has all expected assets; skipping build."
              )
          elif release_exists:
              print(
                  f"Release {release_tag} exists but is missing assets: {', '.join(missing_assets)}"
              )
          else:
              print(f"Release {release_tag} does not exist yet; building all assets.")
          PY

  build-linux-gnu:
    needs: preflight
    if: needs.preflight.outputs.skip_build != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build archive
        run: |
          chmod +x scripts/build_shell_release.sh
          scripts/build_shell_release.sh "${{ inputs.shell }}" "${{ inputs.version }}" "${{ matrix.platform }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}
          path: dist/${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  build-linux-musl:
    needs: preflight
    if: needs.preflight.outputs.skip_build != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-musl
          - runner: ubuntu-22.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build archive in Alpine
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            alpine:3.22 \
            sh -lc '
              apk add --no-cache bash build-base curl ed ncurses-dev python3 tar xz
              chmod +x scripts/build_shell_release.sh
              scripts/build_shell_release.sh "${{ inputs.shell }}" "${{ inputs.version }}" "${{ matrix.platform }}" dist
            '

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}
          path: dist/${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  build-darwin:
    needs: preflight
    if: needs.preflight.outputs.skip_build != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: x86_64-darwin
          - runner: macos-15
            platform: aarch64-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build archive
        run: |
          chmod +x scripts/build_shell_release.sh
          scripts/build_shell_release.sh "${{ inputs.shell }}" "${{ inputs.version }}" "${{ matrix.platform }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}
          path: dist/${{ inputs.shell }}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - build-linux-gnu
      - build-linux-musl
      - build-darwin
      - preflight
    if: needs.preflight.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SHUCK_SHELLS_APP_ID }}
          private-key: ${{ secrets.SHUCK_SHELLS_APP_PRIVATE_KEY }}

      - name: Verify GitHub App installation
        run: test "${{ steps.app-token.outputs.installation-id }}" = "${{ secrets.SHUCK_SHELLS_APP_INSTALLATION_ID }}"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ inputs.shell }}-${{ inputs.version }}-*
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.shell }}-${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.shell }} ${{ inputs.version }}
        run: |
          ls -l dist
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber --repo "$REPO"
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz \
              --repo "$REPO" \
              --title "$RELEASE_TITLE" \
              --notes "Automated ${{ inputs.shell }} ${{ inputs.version }} builds for shuck-shells."
          fi
